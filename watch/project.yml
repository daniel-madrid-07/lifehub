# XcodeGen — genera RepCounter.xcodeproj con `xcodegen generate` (en Mac).
#
# Antes de compilar, cambia `bundleIdPrefix` por el tuyo. El proyecto no lleva
# DEVELOPMENT_TEAM: Xcode usa la cuenta con la que hayas iniciado sesión
# (Signing & Capabilities → Team).
name: RepCounter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    watchOS: "10.0"
packages: {}
schemes:
  RepCounter:
    build:
      targets:
        RepCounter: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  RepCounter:
    type: application
    platform: watchOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
    entitlements:
      path: RepCounter.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.repcounter.watchkitapp
        PRODUCT_NAME: RepCounter
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RepCounter
        WKBackgroundModes:
          - workout-processing
          - alarm
        NSHealthShareUsageDescription: Para leer tu frecuencia cardiaca durante el entreno.
        NSHealthUpdateUsageDescription: Para guardar el entreno en Salud.
        NSMotionUsageDescription: Para contar las repeticiones con el acelerometro.
